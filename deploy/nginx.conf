# ---------------------------------------------------------------------------
# TV Plus STUDIO — Instream Overlay
#
# Public entry point:  http://13.238.93.19/
#
# One origin serves the built frontend AND proxies the FastAPI backend, so the
# browser bundle carries no host or port, CORS never applies, and the same build
# runs on Windows or Linux unchanged.
#
# The backend must be started with a matching public address, because every
# variant / rendition / segment URL it writes into a manifest is built from it:
#
#     PUBLIC_BASE_URL=http://13.238.93.19
#
# ---------------------------------------------------------------------------

#user  nobody;
worker_processes  auto;

#error_log  logs/error.log;
#pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # sendfile is not supported on Windows nginx and can serve stale bytes
    # there. Leave it off on Windows; turn it on once you are on Linux.
    sendfile        off;

    keepalive_timeout  65;

    # The operator bundle is ~700 kB of JavaScript; over the public internet
    # that is worth compressing. Media is left alone: segments are already
    # compressed, and manifests are small and must stream through untouched.
    gzip              on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    server {
        listen      80;
        server_name 13.238.93.19 _;

        # Overlay PNG uploads go through here.
        client_max_body_size 25m;

        # ---- the built frontend (npm run build -> frontend/dist) -----------
        # THIS IS THE ONLY LINE THAT CHANGES BETWEEN MACHINES. Use forward
        # slashes on Windows too:
        #   Windows: C:/Piyush/POC/Instream-Overlay/frontend/dist
        #   Linux:   /opt/instream-overlay/frontend/dist
        root  C:/Piyush/POC/Instream-Overlay/frontend/dist;
        index index.html;

        # The console is a single-page app: /channels, /insights and
        # /channel/<id> are client-side routes with no file on disk, so an
        # unmatched path must fall back to index.html rather than 404.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }

        # Hashed build assets are immutable — let the browser keep them.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
        }

        # The frontend ALSO has a client-side route at exactly /api (the API
        # explorer page), while the backend owns /api/<something>. An exact
        # match wins over every prefix and regex below, so the page is served
        # at /api and the backend still gets /api/channels, /api/health, ...
        location = /api {
            try_files /index.html =404;
        }

        # ---- backend: operator API ----------------------------------------
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering         off;
            proxy_request_buffering off;
            proxy_connect_timeout   10s;
            proxy_send_timeout      300s;
            proxy_read_timeout      300s;
        }

        # ---- backend: live manifests --------------------------------------
        # A live playlist changes every segment. It must never be buffered and
        # never cached, or a player is handed a stale window and stalls.
        # (No CORS header is added here: the backend already sends its own, and
        # a second one makes browsers reject the response outright.)
        location ~ ^/(hls|manifest|rendition)/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache     off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;

            proxy_connect_timeout 10s;
            proxy_read_timeout    300s;
        }

        # ---- backend: media -----------------------------------------------
        # Transcoded overlay segments and uploaded art never change once
        # written, so they are safe to cache.
        location ~ ^/(segment|uploads)/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout    300s;
        }

        # ---- backend: status websocket -------------------------------------
        location = /ws {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;

            # A status socket is idle between overlays; do not cut it at 60s.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html { root html; }
    }
}
