# Instream Overlay behind nginx on Ubuntu: one public origin on port 80 that
# serves the built operator console and proxies the backend. Putting both on the
# same origin means the browser makes no cross-origin requests, so CORS and
# mixed-content problems disappear.
#
# Install:
#   sudo cp deploy/nginx/instream-overlay.conf /etc/nginx/sites-available/instream-overlay
#   sudo ln -sf /etc/nginx/sites-available/instream-overlay /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default      # or it wins on port 80
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_HOST with the server's IP or domain. With this config, set both
#   PUBLIC_BASE_URL=http://YOUR_HOST     (backend/.env — no :8000)
#   VITE_API_BASE=http://YOUR_HOST       (frontend build — no :8000)

upstream instream_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    # Uncomment only if the host has IPv6. On a host with IPv6 disabled this
    # line makes nginx fail to start with "Address family not supported".
    # listen [::]:80;
    server_name YOUR_HOST;

    # Overlay art is uploaded through the console; the default 1m rejects a
    # large PNG with a bare 413.
    client_max_body_size 32m;

    access_log /var/log/nginx/instream-overlay.access.log;
    error_log  /var/log/nginx/instream-overlay.error.log;

    # --- operator console (built SPA) --------------------------------------
    root /opt/instream-overlay/frontend/dist;
    index index.html;

    location / {
        # The trailing "=404" matters: without it, a missing dist/ makes nginx
        # retry index.html forever and answer 500 (rewrite or internal
        # redirection cycle) instead of a plain 404.
        try_files $uri $uri/ /index.html =404;
    }

    # Hashed Vite assets are immutable; index.html must never be cached or the
    # browser keeps loading a stale bundle after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- live manifests ----------------------------------------------------
    # A live playlist is rewritten every few seconds. Buffering or caching it
    # hands the player a playlist whose live edge has already moved, which shows
    # up as stalls and levelParsingError.
    location ~ ^/(hls|manifest|rendition)/ {
        proxy_pass http://instream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        # Players on other origins (a bare hls.js page, a test harness) need
        # this; the console itself is same-origin and does not.
        add_header Access-Control-Allow-Origin "*" always;
    }

    # --- transcoded overlay segments --------------------------------------
    # A published segment is immutable, so it is safe to cache hard. They are
    # swept after OVERLAY_SEGMENT_RETENTION, so keep the browser TTL under that.
    location /segment/ {
        proxy_pass http://instream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        # `expires` emits both Expires and Cache-Control: max-age, so do not add
        # a second Cache-Control here — two of them is ambiguous to some caches.
        expires 10m;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # --- API + uploaded overlay art ---------------------------------------
    location ~ ^/(api|uploads)/ {
        proxy_pass http://instream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An ingest probes every variant of the origin master, which can take a
        # while on a slow origin; the 60s default cuts it off mid-probe.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- status websocket --------------------------------------------------
    location = /ws {
        proxy_pass http://instream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Transcode events can be minutes apart between overlays; the 60s
        # default would drop the socket during every quiet stretch.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
